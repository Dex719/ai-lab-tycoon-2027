# Сборка игры для macOS: два .dmg - для Apple Silicon (arm64) и для Intel (x64). Без подписи Apple: при первом
# запуске Mac спросит разрешение (desktop/README.md). Подпись и нотаризацию добавим, когда будет аккаунт разработчика.
name: Mac build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'desktop/**'
      - '.github/workflows/mac.yml'

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Игра
        run: |
          npm ci
          npx vite build --base=./ --outDir desktop/app/dist --emptyOutDir

      - name: Оболочка и иконка
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node make-icons.mjs
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/icon-1024.png --out build/icon.iconset/icon_${s}x${s}.png > /dev/null
            d=$((s * 2))
            sips -z $d $d build/icon-1024.png --out build/icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Приложения для arm64 и x64
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('../package.json').version")
          npx @electron/packager app "AI Lab Tycoon" --platform=darwin --arch=arm64,x64 \
            --out=out --overwrite --asar --icon=build/icon.icns \
            --app-bundle-id=com.dex719.ailabtycoon --app-version="$VERSION" \
            --app-category-type=public.app-category.simulation-games
          # Без подписи Apple: своя подпись «-» (ad-hoc), без неё Apple Silicon не запускает приложение вовсе.
          for a in arm64 x64; do
            codesign --force --deep --sign - "out/AI Lab Tycoon-darwin-$a/AI Lab Tycoon.app"
          done

      - name: Образы .dmg
        working-directory: desktop
        run: |
          mkdir -p dmg
          for a in arm64 x64; do
            stage="stage-$a"
            rm -rf "$stage" && mkdir "$stage"
            cp -R "out/AI Lab Tycoon-darwin-$a/AI Lab Tycoon.app" "$stage/"
            ln -s /Applications "$stage/Applications"
            name=$([ "$a" = arm64 ] && echo "Apple-Silicon" || echo "Intel")
            hdiutil create -volname "AI Lab Tycoon" -srcfolder "$stage" -ov -format UDZO "dmg/AI-Lab-Tycoon-mac-$name.dmg"
          done
          ls -lh dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Lab-Tycoon-mac
          path: desktop/dmg/*.dmg
          retention-days: 30
